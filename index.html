}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1330;--surface:#121C40;--fg:#E8EEFF;--muted:#A5B3D6;--line:#24325E;--accent:#6C9BFF;--accent-fg:#0A1330;--soft:#1B2A5C;
  --ok:#5CD6A0;--ok-bg:#12332A;--warn:#FFC567;--warn-bg:#3A2C0E;--crit:#FF8A80;--crit-bg:#3E1713;--off:#A5B3D6;--off-bg:#1F2A4D;color-scheme:dark}}

  --ok:#5CD6A0;--ok-bg:#12332A;--warn:#FFC567;--warn-bg:#3A2C0E;--crit:#FF8A80;--crit-bg:#3E1713;--off:#A5B3D6;--off-bg:#1F2A4D;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
[data-s=ok]{--c:var(--ok);--cb:var(--ok-bg)}
[data-s=warn]{--c:var(--warn);--cb:var(--warn-bg)}
[data-s=crit]{--c:var(--crit);--cb:var(--crit-bg)}
[data-s=off],[data-s=conn],[data-s=info]{--c:var(--off);--cb:var(--off-bg)}

.top{display:flex;align-items:center;gap:10px;min-height:48px}
.top h1{flex:1;font-size:20px;font-weight:800;min-width:0;overflow-wrap:anywhere}
.ib{width:44px;height:44px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;cursor:pointer;box-shadow:0 1px 5px rgba(11,31,92,.12);flex:none}
.chip-btn{min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;cursor:pointer;flex:none}
.card{background:var(--surface);border-radius:16px;padding:14px;box-shadow:0 1px 6px rgba(11,31,92,.10);border:0;width:100%;text-align:left;display:flex;flex-direction:column;gap:10px}
button.card{cursor:pointer}
.row{display:flex;align-items:center;gap:10px}.row.sb{justify-content:space-between}.wrapf{flex-wrap:wrap}
.muted{color:var(--muted)}.small{font-size:12px}.b{font-weight:700}.xb{font-weight:800}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;color:var(--c);background:var(--cb);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.btn{min-height:50px;padding:0 18px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-fg);font-weight:700;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-align:center}
.btn.ghost{background:transparent;border:1.5px solid var(--accent);color:var(--accent)}
.btn.sm{min-height:44px;padding:0 14px;font-size:13px;border-radius:10px}
.btn.full{width:100%}
.btn:focus-visible,.chip-btn:focus-visible,.ib:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.lbl{font-size:13px;font-weight:600}
input[type=text],input[type=email],input[type=password],select,textarea{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;background:var(--surface);font-size:16px}
textarea{padding:10px 14px;min-height:90px}
input[type=checkbox],input[type=radio]{width:22px;height:22px;accent-color:var(--accent);flex:none;margin:0}
.err{color:var(--crit);font-size:13px;font-weight:600}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;min-height:44px;border:0;border-radius:10px;background:transparent;font-weight:700;font-size:14px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chips button{flex:none;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}

.vals div{display:flex;flex-direction:column;min-width:0}

.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pc{background:var(--surface);border-radius:14px;padding:12px;border:2px solid transparent;box-shadow:0 1px 4px rgba(11,31,92,.08);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0}

.pc .big small{font-size:12px;color:var(--muted);font-family:var(--font);font-weight:600}
.spark{width:100%;height:30px}
.spark path.l{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart{width:100%;height:auto}
.chart .band{fill:var(--ok-bg)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .lim{stroke:var(--ok);stroke-width:1.5;stroke-dasharray:5 4}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font)}
.chart .now{fill:var(--c);stroke:var(--surface);stroke-width:2}
.banner{border-radius:14px;padding:12px 14px;background:var(--cb);color:var(--fg);border:1.5px solid var(--c);display:flex;gap:10px;align-items:flex-start}
.banner b{color:var(--c)}
.mapgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;background:var(--soft);padding:14px;border-radius:16px;position:relative}
.tile{border-radius:12px;background:var(--cb);border:2px solid var(--c);padding:12px;text-align:center;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font-weight:700}
.tile .n{width:28px;height:28px;border-radius:50%;background:var(--c);color:var(--surface);display:grid;place-items:center;font-family:var(--num)}
.tile[data-s=off]{border-style:dashed}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}

.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--crit);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
#toasts{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;flex-direction:column;gap:8px;align-items:center;padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.toast{pointer-events:auto;width:min(100%,420px);text-align:left;border:1.5px solid var(--c);background:var(--surface);border-radius:14px;padding:10px 14px;box-shadow:0 6px 20px rgba(11,31,92,.25);display:flex;flex-direction:column;gap:2px;cursor:pointer}
.toast strong{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.sheetbg{position:fixed;inset:0;z-index:30;background:rgba(5,12,40,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(100%,480px);max-height:88vh;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.alarm{position:fixed;inset:0;z-index:50;background:#8E1A13;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px))}
.alarm .big{font-family:var(--num);font-size:64px;font-weight:700;line-height:1}
.alarm .btn{background:#fff;color:#8E1A13;min-height:60px;width:min(100%,360px);font-size:18px;font-weight:800}
.alarm .btn.ghost{background:transparent;border:2px solid #fff;color:#fff;font-size:15px;min-height:50px}
@media (prefers-reduced-motion:no-preference){.alarm{animation:pulse 1s infinite alternate}@keyframes pulse{from{background:#8E1A13}to{background:#B3261E}}}
.hero{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding-top:8px}
.hero h1{font-size:30px;font-weight:800;letter-spacing:.02em}
.lock{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.qr{background:#fff;padding:8px;border-radius:10px;border:1.5px solid var(--line);align-self:center;line-height:0}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--surface);border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center;box-shadow:0 1px 4px rgba(11,31,92,.08)}
.opt{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);cursor:pointer}
.opt:has(input:checked){border-color:var(--accent);background:var(--soft)}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) 78px 78px;gap:8px;align-items:center}
.rrow input{text-align:center;padding:0 8px;min-height:44px}
.tabs-note{font-size:12px;color:var(--muted)}

.stale{opacity:.55}
.demo{align-self:flex-start}
.rblock{display:flex;flex-direction:column;gap:6px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.rgrid .field label{font-size:12px;color:var(--muted)}
.rgrid input{text-align:center;min-height:44px}
.sens{display:flex;flex-wrap:wrap;gap:6px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px}
</style>
</head>

/* ===== Utilidades ===== */

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (v, d) => Number(v).toFixed(d);

/* ===== Textos (español) ===== */
const T = {

lv_warn:"Aviso",lv_crit:"Crítica",lv_conn:"Conexión",lv_info:"Resumen",notif:"Notificación",
how:"Cómo te avisamos",alarm_after:"Alarma si nadie atiende (segundos, demo)",alarm_off:"Apagada",sound:"Sonido de alarma",hourly:"Resumen cada hora",sim_hour:"Simular resumen de la hora",

sc_normal:"Normalizar",sc_o2:"Oxígeno bajo",sc_ph:"pH bajo",sc_temp:"Temperatura alta",sc_sal:"Salinidad alta",sc_off:"Desconectar",sc_on:"Reconectar",speed:"Velocidad",

};
const t = (k, o) => { let s = T[k] || k; if (o) for (const x in o) s = s.replace("{" + x + "}", o[x]); return s; };

/* ===== Parámetros =====
   Rangos preliminares: Normal dentro de [min, max]; Aviso fuera de ese rango; Crítico más allá de cmin/cmax.
   Oxígeno, temperatura y pH salen del documento del proyecto; los límites de pH 7.0 y 9.0 son una propuesta de demostración.
   Salinidad: el límite crítico (cambio brusco) está por definir, por eso es null. */
const PK = ["ph", "o2", "temp", "sal"];
const PD = {
  ph:{u:"",d:2,base:8.1,noise:.025,min:7.5,max:8.5,cmin:7.0,cmax:9.0,amp:.15,ph0:10},
  o2:{u:"mg/L",d:1,base:5.8,noise:.1,min:5,max:null,cmin:4,cmax:null,amp:.7,ph0:11},
  temp:{u:"°C",d:1,base:29.2,noise:.12,min:26,max:32,cmin:24,cmax:33,amp:1.1,ph0:9},
  sal:{u:"ppt",d:1,base:20,noise:.12,min:15,max:25,cmin:null,cmax:null,amp:.2,ph0:0}
};
/* Valores objetivo del simulador por gravedad */
const SC = {o2:{warn:4.5,crit:2.6}, ph:{warn:7.2,crit:6.9}, temp:{warn:32.6,crit:33.8}, sal:{warn:28,crit:28}};
const PER = {"24h":24 * 3600e3, "7d":7 * 24 * 3600e3, "30d":30 * 24 * 3600e3};

/* ===== Estado ===== */
let uid = 0, aid = 0, lid = 0, did = 0;
const S = {
  user:null, view:"auth", authMode:"login", authErr:{}, pid:null, sel:"o2", homeMode:"list", per:"24h",
  ponds:[], alerts:[], logs:[], aTab:"active", cat:"c_feed", addOpen:false, csv:"",
  set:{alarm:15, sound:true, hourly:true, need:3}, speed:1, simOpen:false, simPond:null, sev:"crit", lastSum:0,
  plan:{status:"trial", days:14, period:"a"}, pay:{period:"a", method:"m_store", ref:null},
  alarmId:null, rangesPond:null, rangesErr:"", flash:""
};

function makePond(name, base) {
  const p = {id:++uid, name, online:true, off:0, ts:Date.now(), vals:{}, tg:{}, hist:{}, ser:{}, ranges:{}, cnt:{},
    dev:{id:"B-" + String(++did).padStart(3, "0"), batt:70 + Math.floor(Math.random() * 25)}};
  const now = Date.now(), N = 1440, step = 1800e3;
  PK.forEach(k => {

function pst(p, k) {

  if ((r.cmin != null && v < r.cmin) || (r.cmax != null && v > r.cmax)) return "crit";

}

}

function tick() {
  S.ponds.forEach(p => {
    if (!p.online) { p.off++; PK.forEach(k => p.cnt[k] = 0); return; }
    p.off = 0; p.ts = Date.now();
    PK.forEach(k => {
      const d = PD[k];
      p.vals[k] += (p.tg[k] - p.vals[k]) * .15 + (Math.random() - .5) * d.noise * 2;
      p.hist[k].push(p.vals[k]); if (p.hist[k].length > 240) p.hist[k].shift();
      p.cnt[k] = pst(p, k) === "ok" ? 0 : p.cnt[k] + 1;

  afterTick();
}

  p.online = true; p.off = 0;
  if (s === "on") return;

function evalAlerts() {

      const lvl = pst(p, k), a = S.alerts.find(x => x.pid === p.id && x.k === k && !x.resolved);
      if (lvl === "ok") { if (a) { a.resolved = true; a.resolvedAt = now; } return; }
      if (!a) { if (p.cnt[k] >= S.set.need) newAlert(p, k, lvl); return; }
      a.v = p.vals[k]; a.dir = pdir(p, k);
      if (a.level !== lvl) { const worse = lvl === "crit"; a.level = lvl; if (worse) { a.ts = now; a.ackAt = null; a.snoozeUntil = 0; notify(a); } }
    });

  switch (a) {
    case "amode": S.authMode = v; S.authErr = {}; render(); break;
    case "social": login({name:"Demo", email:"demo@b-metric.app"}); break;
    case "go": go(v); break;
    case "back": go(S.view === "pond" ? "home" : (S.view === "pay" ? "plans" : "more")); break;
    case "pond": S.pid = +id; S.simPond = +id; go("pond"); break;
    case "sel": S.sel = el.dataset.k; render(); break;
    case "per": S.per = v; render(); break;
    case "hmode": S.homeMode = v; render(); break;
    case "addopen": S.addOpen = true; render(); { const i = $("#np"); if (i) i.select(); } break;
    case "addclose": S.addOpen = false; render(); break;
    case "signout": S.user = null; S.view = "auth"; hideAlarm(); render(); break;
    case "atab": S.aTab = v; render(); break;
    case "ack": { const x = S.alerts.find(z => z.id === +id); if (x) x.ackAt = Date.now(); alarmCheck(); render(); break; }
    case "hourly": addSummary(); render(); break;
    case "cat": S.cat = v; S.flash = ""; render(); break;
    case "logfor": S.pid = +id; go("logs"); break;
    case "csv": {
      const p = pondById(S.pid); if (!p) break;
      const win = PER[S.per === "live" ? "24h" : S.per], from = Date.now() - win, rows = ["fecha_hora,ph,oxigeno_mgL,temperatura_C,salinidad_ppt"];
      const ref = p.ser.ph;
      for (let i = 0; i < ref.length; i++) if (ref[i][0] >= from) rows.push(stamp(ref[i][0]) + "," + PK.map(k => fmt(p.ser[k][i][1], PD[k].d)).join(","));
      rows.push(stamp(Date.now()) + "," + PK.map(k => fmt(p.vals[k], PD[k].d)).join(","));
      const text = rows.join("\n");
      (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(text).then(() => toast(t("copied"), "ok")) : Promise.reject()).catch(() => { S.csv = text; render(); toast(t("copy_fail"), "warn"); });
      break;
    }
    case "rdef": { const p = pondById(S.rangesPond); PK.forEach(k => p.ranges[k] = {min:PD[k].min, max:PD[k].max, cmin:PD[k].cmin, cmax:PD[k].cmax}); S.rangesErr = ""; render(); break; }
    case "rall": { const src = pondById(S.rangesPond); S.ponds.forEach(p => PK.forEach(k => p.ranges[k] = {...src.ranges[k]})); S.flash = "saved"; render(); break; }
    case "simpay": S.plan = {status:"active", days:0, period:S.pay.period}; toast(t("paid"), "ok"); go("more"); break;
    case "sim": S.simOpen = true; if (S.view === "pond" && S.pid) S.simPond = S.pid; renderSheet(); break;
    case "simclose": S.simOpen = false; renderSheet(); break;
    case "sev": S.sev = v; renderSheet(); break;
    case "scen": { const p = pondById(S.simPond); if (p) { scen(p, v); evalAlerts(); } renderSheet(); render(); break; }
    case "speed": S.speed = +v; restartTimer(); renderSheet(); break;
    case "endtrial": S.plan = {status:"expired", days:0, period:S.plan.period}; S.simOpen = false; renderSheet(); hideAlarm(); render(); break;
    case "restart": S.plan = {status:"trial", days:14, period:S.plan.period}; S.simOpen = false; renderSheet(); render(); break;
    case "alarm-stop": { const x = S.alerts.find(z => z.id === S.alarmId); if (x) x.ackAt = Date.now(); hideAlarm(); render(); break; }
    case "alarm-snooze": { const x = S.alerts.find(z => z.id === S.alarmId); if (x) x.snoozeUntil = Date.now() + 30000; hideAlarm(); break; }
  }
});
document.addEventListener("change", e => {
  const el = e.target.closest("[data-c]"); if (!el) return; const c = el.dataset.c;
  if (c === "alarm") S.set.alarm = +el.value;
  else if (c === "need") S.set.need = +el.value;
  else if (c === "sound") S.set.sound = el.checked;
  else if (c === "hourly") S.set.hourly = el.checked;
  else if (c === "rpond") { S.rangesPond = +el.value; S.rangesErr = ""; S.flash = ""; render(); }
  else if (c === "simpond") { S.simPond = +el.value; renderSheet(); }
  else if (c === "period") S.pay.period = el.value;
  else if (c === "method") { S.pay.method = el.value; render(); }
});
document.addEventListener("submit", e => {
  e.preventDefault(); const f = e.target.id;
  if (f === "authform") {
    const reg = S.authMode === "register", em = $("#a-email").value.trim(), pw = $("#a-pw").value, nm = reg ? $("#a-name").value.trim() : "";
    S.authErr = {email:!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em), pw:pw.length < 8, name:reg && !nm};
    if (S.authErr.email || S.authErr.pw || S.authErr.name) { render(); return; }
    login({name:nm || em.split("@")[0], email:em});
  } else if (f === "addform") {
    const nm = $("#np").value.trim() || ("Estanque " + (S.ponds.length + 1)), p = makePond(nm); S.ponds.push(p); S.addOpen = false; render();
  } else if (f === "logform") {
    const q = parseFloat(($("#l-qty").value || "").replace(",", "."));
    if (!(q > 0)) { S.flash = "e_qty"; render(); return; }
    S.logs.unshift({id:++lid, pid:+$("#l-pond").value, cat:S.cat, qty:q, det:$("#l-det").value.trim(), ts:Date.now()}); S.flash = ""; render(); toast(t("saved"), "ok");
  } else if (f === "rform") {
    const p = pondById(S.rangesPond), nr = {}; let bad = false;
    PK.forEach(k => {
      const g = fld => { const s = $("#r-" + k + "-" + fld).value.trim().replace(",", "."); return s === "" ? null : Number(s); };
      const o = {min:g("min"), max:g("max"), cmin:g("cmin"), cmax:g("cmax")};
      if (Object.values(o).some(x => x != null && isNaN(x))) bad = true;
      else {
        if (o.min != null && o.max != null && o.min > o.max) bad = true;
        if (o.cmin != null && o.min != null && o.cmin > o.min) bad = true;
        if (o.cmax != null && o.max != null && o.cmax < o.max) bad = true;
        if (o.cmin != null && o.cmax != null && o.cmin > o.cmax) bad = true;
      }
      nr[k] = o;
    });
    if (bad) { S.rangesErr = "e_range"; S.flash = ""; render(); return; }
    p.ranges = nr; S.rangesErr = ""; S.flash = "saved"; evalAlerts(); render(); renderNav();
  }
});

/* ===== Arranque ===== */
let timer = null;
function restartTimer() { clearInterval(timer); timer = setInterval(tick, 2000 / S.speed); }
seed(); render(); restartTimer(); setInterval(alarmCheck, 1000);

</script>
